<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GA Pulse — Current Affairs Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a2b;
    --paper:#fbf9f5;
    --paper-2:#ffffff;
    --line:#e7e2d8;
    --muted:#726d80;
    --gold:#e2a339;
    --remember:#fff4d6;
    --remember-line:#eab93f;
    --statictone:#e7f0ff;
    --statictone-line:#7fa8ff;

    --A:#2f5fdc; --A-soft:#e8edff;
    --B:#1f9d55; --B-soft:#e5f7ec;
    --C:#8b3fd6; --C-soft:#f2e9fb;
    --D:#d64545; --D-soft:#fdeaea;
    --E:#e07b1a; --E-soft:#fdf0e0;
    --F:#0e9488; --F-soft:#e2f6f4;
    --G:#d6318a; --G-soft:#fbe6f1;
    --H:#a6791f; --H-soft:#f7f0dd;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    letter-spacing:.2px;
  }
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold);color:#fff;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--paper-2);
    border-bottom:2px solid var(--line);
    padding:14px 22px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:'Baloo 2',cursive;font-weight:800;font-size:1.25rem;
    color:var(--ink);white-space:nowrap;
  }
  .brand .dot{
    width:12px;height:12px;border-radius:50%;
    background:conic-gradient(from 90deg,var(--A),var(--E),var(--G),var(--F),var(--A));
  }
  .topbar-spacer{flex:1;}
  .nav-btn{
    border:2px solid var(--ink);background:#fff;color:var(--ink);
    padding:8px 16px;border-radius:100px;font-weight:700;font-size:.9rem;
    white-space:nowrap;transition:.15s;
  }
  .nav-btn:hover{border-color:var(--gold);color:var(--gold-deep,#b9822a);}
  .nav-btn.back-btn{background:var(--ink);color:#fff;}
  .nav-btn.back-btn:hover{background:#000;border-color:#000;color:#fff;}
  .nav-btn[disabled]{opacity:.35;pointer-events:none;}

  /* ---------- Layout shell ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:34px 22px 80px;}

  .hero{
    text-align:left;margin-bottom:30px;
  }
  .hero .eyebrow{
    font-weight:700;color:var(--gold);font-size:.95rem;margin-bottom:6px;
  }
  .hero h1{font-size:2.3rem;margin:0 0 8px;line-height:1.15;}
  .hero p{color:var(--muted);font-size:1.02rem;max-width:640px;margin:0;}

  /* ---------- Month grid ---------- */
  .month-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px;
  }
  @media(max-width:820px){.month-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:560px){.month-grid{grid-template-columns:repeat(2,1fr);}}

  .month-btn{
    position:relative;
    border:none;border-radius:18px;
    padding:22px 16px 18px;
    text-align:left;
    background:var(--paper-2);
    box-shadow:0 1px 0 var(--line) inset;
    border:2px solid var(--line);
    transition:transform .15s ease, border-color .15s ease;
    overflow:hidden;
  }
  .month-btn:hover{transform:translateY(-3px);border-color:var(--m-color,var(--gold));}
  .month-btn .stripe{
    position:absolute;top:0;left:0;right:0;height:6px;
    background:var(--m-color);
  }
  .month-btn .mnum{
    font-size:.78rem;color:var(--muted);font-weight:700;
  }
  .month-btn .mname{
    font-family:'Baloo 2',cursive;font-size:1.28rem;font-weight:700;margin-top:2px;
  }
  .month-btn .mcount{
    margin-top:10px;display:inline-block;font-size:.78rem;font-weight:700;
    background:var(--m-soft);color:var(--m-color);padding:3px 10px;border-radius:100px;
  }
  .month-btn.disabled{opacity:.4;pointer-events:none;}

  /* ---------- Section label ---------- */
  .section-label{
    font-weight:800;font-size:1.05rem;margin:36px 0 14px;
    display:flex;align-items:center;gap:10px;
  }
  .section-label .tag{
    font-size:.72rem;font-weight:700;color:var(--muted);
    border:1.5px dashed var(--line);border-radius:100px;padding:3px 10px;
  }

  /* ---------- Sort bar ---------- */
  .sort-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;
  }
  .sort-bar span{font-size:.85rem;color:var(--muted);font-weight:600;}
  .pill-btn{
    border:1.5px solid var(--line);background:var(--paper-2);
    padding:7px 14px;border-radius:100px;font-weight:600;font-size:.85rem;
    transition:.15s;
  }
  .pill-btn:hover{border-color:var(--ink);}
  .pill-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---------- Topic grid (Main / Sub / Minor) ---------- */
  .topic-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  }
  @media(max-width:900px){.topic-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.topic-grid{grid-template-columns:1fr;}}

  .topic-card{
    border:2px solid var(--line);border-radius:16px;background:var(--paper-2);
    padding:16px 16px 14px;text-align:left;transition:.15s;
    display:flex;flex-direction:column;gap:8px;
  }
  .topic-card:hover{transform:translateY(-2px);border-color:var(--t-color);}
  .topic-card .icon{
    width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;font-size:1.25rem;
    background:var(--t-soft);
  }
  .topic-card .tname{font-weight:800;font-size:1rem;line-height:1.25;}
  .topic-card .tmeta{
    font-size:.75rem;color:var(--t-color);font-weight:700;
  }
  .weight-bar{
    height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px;
  }
  .weight-bar > i{display:block;height:100%;background:var(--t-color);}

  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}
  .topic-chip{
    border:1.5px solid var(--t-color,var(--line));
    background:var(--t-soft,var(--paper-2));
    color:var(--t-color,var(--ink));
    padding:9px 15px;border-radius:100px;font-weight:700;font-size:.86rem;
  }
  .topic-chip:hover{filter:brightness(.95);}
  .topic-chip.all{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ---------- Story card (themed per topic) ---------- */
  .news-list{display:flex;flex-direction:column;gap:28px;margin-top:18px;}

  .story-card{
    border-radius:22px;overflow:hidden;background:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 22px 44px -20px rgba(18,54,38,.32), 0 6px 14px -6px rgba(0,0,0,.10);
  }

  .story-top{
    position:relative;color:#f4ede0;padding:26px 26px 22px;
    background:
      radial-gradient(circle at 18px 18px, rgba(255,255,255,.10) 1.5px, transparent 1.6px) 0 0/26px 26px,
      linear-gradient(135deg,
        color-mix(in srgb, var(--n-color) 85%, #06110c 15%) 0%,
        color-mix(in srgb, var(--n-color) 55%, #0b1220 45%) 55%,
        color-mix(in srgb, var(--n-color) 35%, #000 12%) 100%);
  }
  .story-top::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,var(--gold),var(--n-color) 55%,var(--gold));
  }
  .story-breadcrumb{
    font-size:.82rem;font-weight:700;line-height:1.55;margin-bottom:12px;
    color:#fbe9c4;opacity:.92;
  }
  .story-breadcrumb .sep{margin:0 4px;opacity:.7;}
  .story-title{
    font-family:'Fraunces',serif;font-optical-sizing:auto;
    font-size:1.5rem;line-height:1.25;font-weight:700;color:#fff;margin:0;
  }
  .story-meta{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:18px;flex-wrap:wrap;
  }
  .story-date{
    font-size:.85rem;font-weight:700;color:var(--ink);
    background:#f4ede0;border-radius:100px;padding:6px 14px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .story-priority{
    background:linear-gradient(135deg,var(--gold),#b9822a);color:#3a2506;
    border-radius:100px;padding:7px 16px;font-size:.85rem;font-weight:800;
    display:inline-flex;align-items:center;gap:5px;
    box-shadow:0 4px 10px -3px rgba(185,130,42,.5);
  }

  .story-content{padding:24px 26px 6px;}
  .story-lead{
    font-size:1.02rem;line-height:1.68;color:#494940;margin:0 0 6px;font-weight:500;
  }
  .story-lead::first-letter{
    font-family:'Fraunces',serif;font-weight:700;font-size:2.3em;
    color:color-mix(in srgb, var(--n-color) 70%, black 30%);
    float:left;line-height:.85;padding-right:8px;padding-top:3px;
  }

  .story-section-label{
    display:flex;align-items:center;gap:10px;
    font-family:'Fraunces',serif;font-size:1.08rem;font-weight:700;
    margin:22px 0 10px;color:var(--ink);
  }
  .story-section-label .bar{
    width:5px;height:18px;border-radius:3px;flex-shrink:0;
    background:linear-gradient(180deg,var(--gold),var(--n-color));
  }

  .story-list{list-style:none;margin:0 0 4px;padding:0;color:#3a3a34;font-size:.98rem;line-height:1.6;}
  .story-list li{position:relative;padding:8px 4px 8px 24px;border-bottom:1px dashed #e7e1d1;}
  .story-list li:last-child{border-bottom:none;}
  .story-list li::before{
    content:"";position:absolute;left:2px;top:16px;width:8px;height:8px;
    border-radius:50%;background:var(--ink);
  }

  .story-box{border-radius:16px;padding:4px 20px 16px;margin:20px 0;}
  .story-box-head{display:flex;align-items:center;gap:10px;padding:14px 0 10px;}
  .story-icon{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.95rem;
  }
  .story-box.remember{background:linear-gradient(175deg,#fdf1d2,#fff8e8);border:1.5px solid #e3b23c;}
  .story-box.remember .story-icon{background:#e3b23c;color:#5c440f;}
  .story-box.remember .story-box-title{color:#7a5a10;font-weight:800;font-size:1rem;font-family:'Fraunces',serif;}
  .story-box.static{background:linear-gradient(175deg,#e9eefb,#f5f8ff);border:1.5px solid #7797d9;}
  .story-box.static .story-icon{background:#7797d9;color:#fff;}
  .story-box.static .story-box-title{color:#2c4d8f;font-weight:800;font-size:1rem;font-family:'Fraunces',serif;}

  .story-box ul{margin:0;padding-left:2px;list-style:none;}
  .story-box li{
    font-size:.94rem;line-height:1.6;color:#41403a;margin:0;padding:7px 0 7px 20px;
    position:relative;border-bottom:1px solid rgba(0,0,0,.055);
  }
  .story-box li:last-child{border-bottom:none;}
  .story-box li::before{content:"▸";position:absolute;left:0;top:6px;font-size:.8rem;color:var(--ink);}

  .story-flash{list-style:none;margin:0 0 6px;padding:0;border-radius:14px;overflow:hidden;border:1.5px solid #ded3b2;}
  .story-flash li{
    display:flex;align-items:baseline;gap:10px;padding:11px 16px;
    font-size:.9rem;line-height:1.5;color:#4a493f;background:#fffdf6;
  }
  .story-flash li:nth-child(even){background:#fbf3de;}
  .story-flash li:not(:last-child){border-bottom:1px dashed #e6dcbe;}
  .story-flash b{color:var(--ink);font-weight:800;}

  .story-divider{height:1px;background:linear-gradient(90deg,transparent,#ddd0a8,transparent);margin:20px 0 2px;}

  .story-footer{
    padding:18px 26px 24px;color:#6f6e63;font-size:.86rem;line-height:1.7;
    border-top:1px solid #eee3c6;margin-top:10px;
  }
  .story-footer strong{font-weight:800;color:var(--ink);font-family:'Fraunces',serif;font-size:.98rem;}
  .story-hashtags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .story-hashtags span{
    background:var(--n-soft);color:color-mix(in srgb, var(--n-color) 75%, black 25%);
    border:1px solid var(--n-color);border-radius:100px;padding:4px 12px;
    font-weight:700;font-size:.78rem;
  }

  @media(min-width:860px){
    .story-top{padding:36px 44px 30px;}
    .story-title{font-size:1.9rem;}
    .story-breadcrumb{font-size:.9rem;}
    .story-content{padding:32px 44px 6px;}
    .story-lead{font-size:1.08rem;}
    .story-list{column-count:2;column-gap:30px;}
    .story-list li{break-inside:avoid;}
    .story-box{padding:4px 26px 16px;}
    .story-box ul{column-count:2;column-gap:24px;}
    .story-box li{break-inside:avoid;}
    .story-footer{padding:20px 44px 28px;}
  }
  @media(max-width:520px){
    .story-top{padding:20px 18px 18px;}
    .story-title{font-size:1.25rem;}
    .story-content{padding:20px 18px 4px;}
    .story-footer{padding:16px 18px 20px;}
  }

  .pdf-row{display:flex;justify-content:center;margin:30px 0 10px;}
  .pdf-btn{
    border:none;background:linear-gradient(135deg,var(--ink),#000);color:#fff;
    padding:13px 26px;border-radius:100px;font-weight:800;font-size:.95rem;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.5);transition:.15s;
  }
  .pdf-btn:hover{transform:translateY(-2px);}
  .pdf-btn[disabled]{opacity:.5;pointer-events:none;}

  .empty-state{
    border:2px dashed var(--line);border-radius:18px;padding:40px 24px;
    text-align:center;color:var(--muted);
  }
  .empty-state .big{font-size:2rem;margin-bottom:8px;}

  .note{
    font-size:.8rem;color:var(--muted);background:var(--paper-2);
    border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;
    margin-top:34px;
  }

  .view{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> GA Pulse</div>
  <div class="topbar-spacer"></div>
  <button class="nav-btn" id="homeBtn">🏠 Home</button>
  <button class="nav-btn back-btn" id="backBtn">← Back</button>
</div>

<div class="shell view" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ======================= DATA ======================= */

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const MONTH_COLORS = ["#2f5fdc","#1f9d55","#8b3fd6","#d64545","#e07b1a","#0e9488","#d6318a","#a6791f","#2f5fdc","#1f9d55","#8b3fd6","#d64545"];

const TOPICS = [
  {code:"A", name:"Banking & Financial Awareness", weight:28, emoji:"🏦",
    subs:[
      {name:"RBI & Monetary Policy", weight:32, emoji:"💰", minors:["Repo Rate / Reverse Repo","Monetary Policy Committee","Inflation Target","RBI Reports","RBI Guidelines"]},
      {name:"Banking Structure", weight:18, emoji:"🏛️", minors:["PSB Number / Classification","Regional Rural Banks","Small Finance Banks","Payment Banks","Local Area Banks"]},
      {name:"Banking Schemes", weight:25, emoji:"📋", minors:["PMJDY","PMMY","PM Surya Ghar","AIF","Stand Up India","Financial Inclusion Schemes"]},
      {name:"Digital Banking & Payments", weight:25, emoji:"💳", minors:["UPI","AEPS","Mobile Seva","Digital Rupee","UPI Lite","BBPS"]}
    ]},
  {code:"B", name:"National Current Affairs", weight:24, emoji:"🇮🇳",
    subs:[
      {name:"Government Schemes", weight:40, emoji:"📜", minors:["PM Surya Ghar Yojana","SMILE Scheme","Startup Ranking","Digital India Initiatives","Agriculture Schemes","Infrastructure Programs"]},
      {name:"Government Reports / Index", weight:25, emoji:"📊", minors:["UNFPA Report","NHAI Green Cover Index","Economic Survey","Global Innovation Index","Human Development Index"]},
      {name:"Committees & Appointments", weight:20, emoji:"👥", minors:["Finance Commission","Expert Committees","Regulatory Appointments","Government Panels"]},
      {name:"Infrastructure Projects", weight:15, emoji:"🌉", minors:["Sea Bridges","Highways","Metro Projects","Ports & Corridors"]}
    ]},
  {code:"C", name:"International Affairs", weight:8, emoji:"🌍",
    subs:[
      {name:"Global Organizations", weight:50, emoji:"🏢", minors:["IMF reports","World Bank programs","WHO initiatives","IMO headquarters","UNESCO programs"]},
      {name:"International Agreements", weight:50, emoji:"🤝", minors:["India–Mauritius MoU","Lithium exploration agreement","Defence agreements","Space collaboration"]}
    ]},
  {code:"D", name:"Defence & Space", weight:7, emoji:"🚀",
    subs:[
      {name:"Defence & Space Highlights", weight:100, emoji:"🛡️", minors:["Defence exercises","DRDO weapons","Naval operations","ISRO missions","Pinaka MBRL","Aditya-L1 mission","Chandrayaan-1","Naval rescue operations"]}
    ]},
  {code:"E", name:"Sports", weight:6, emoji:"🏅",
    subs:[
      {name:"Sports Highlights", weight:100, emoji:"⚽", minors:["International tournaments","National sports awards","Cricket tournaments","Olympic sports","ICC T20 World Cup winners","Khel Ratna awards","Irani Cup","Hockey India awards"]}
    ]},
  {code:"F", name:"Environment & Geography", weight:7, emoji:"🌿",
    subs:[
      {name:"Environment Highlights", weight:100, emoji:"🐯", minors:["Ramsar sites","Tiger reserves","National parks","Wildlife sanctuaries","Udaipur Jheel Ramsar site","Pench Tiger Reserve","Dark Sky Reserve"]}
    ]},
  {code:"G", name:"Culture & Awards", weight:5, emoji:"🎭",
    subs:[
      {name:"Culture & Awards Highlights", weight:100, emoji:"🏆", minors:["National awards","Literature awards","Cultural festivals","Dadasaheb Phalke award","International Booker Prize","Ustad Bismillah Khan award"]}
    ]},
  {code:"H", name:"Static GK", weight:15, emoji:"📚",
    subs:[
      {name:"Static GK Highlights", weight:100, emoji:"🗺️", minors:["Capitals","Important days","Geography","Institutions","National Youth Day","Gangtok capital","Mount Kamet location","Legislative assembly UTs"]}
    ]}
];

const COLOR = {}, SOFT = {};
TOPICS.forEach(t=>{ COLOR[t.code]=`var(--${t.code})`; SOFT[t.code]=`var(--${t.code}-soft)`; });

/* ---- News content now lives in /data/news.json — this is the file you bulk-edit.
   NEWS starts empty and is populated by loadData() below before the first render. ---- */
let NEWS = [];
let dataLoaded = false;
let dataError = null;

/* ======================= STATE ======================= */
const state = { month:null, main:null, sub:null, minor:null, sort:"date" };

function newsForFilter({month=state.month, main=state.main, sub=state.sub, minor=state.minor}={}){
  return NEWS.filter(n=>
    (month===null || n.month===month) &&
    (main===null || n.main===main) &&
    (sub===null || n.sub===sub) &&
    (minor===null || n.minor===minor)
  );
}
function sortNews(list){
  const arr=[...list];
  if(state.sort==="date") arr.sort((a,b)=>a.month-b.month || a.date.localeCompare(b.date));
  if(state.sort==="date-desc") arr.sort((a,b)=>b.month-a.month || b.date.localeCompare(a.date));
  if(state.sort==="importance") arr.sort((a,b)=>b.importance-a.importance);
  return arr;
}

/* ======================= RENDER HELPERS ======================= */
const app = document.getElementById("app");
const homeBtn = document.getElementById("homeBtn");
const backBtn = document.getElementById("backBtn");

function go(level){
  if(level==="home"){ state.month=null; state.main=null; state.sub=null; state.minor=null; }
  if(level==="main"){ state.main=null; state.sub=null; state.minor=null; }
  if(level==="sub"){ state.sub=null; state.minor=null; }
  if(level==="minor"){ state.minor=null; }
  render();
}

homeBtn.addEventListener("click", ()=>go("home"));

backBtn.addEventListener("click", ()=>{
  if(state.minor!==null) return go("sub");
  if(state.sub!==null) return go("main");
  if(state.main!==null) return go("home");
  // already home — no-op
});

function renderNav(){
  const atHome = state.month===null;
  homeBtn.disabled = atHome;
  backBtn.disabled = atHome;
}

/* ======================= VIEWS ======================= */

function viewHome(){
  const html = `
    <div class="hero">
      <div class="eyebrow">📅 Pick a month to begin</div>
      <h1>Revise Current Affairs, one month at a time</h1>
      <p>Tap a month to open its news wall — then filter down by Main, Sub and Minor topic to drill into exactly what you need to revise.</p>
    </div>
    <div class="month-grid">
      ${MONTHS.map((m,i)=>{
        const count = newsForFilter({month:i, main:null, sub:null, minor:null}).length;
        return `

function toArray(v){
  if(Array.isArray(v)) return v;
  if(typeof v === "string") return v.split("|").map(s=>s.trim()).filter(Boolean);
  return [];
}

function safeTopic(code){
  const raw = String(code||"").trim();
  const clean = raw.toUpperCase();
  // 1) exact single-letter code match (A-H)
  let t = TOPICS.find(t=>t.code===clean);
  if(t) return t;
  // 2) fall back to matching by full topic name, in case someone entered
  //    "Banking & Financial Awareness" instead of "A"
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");
  const rawNorm = norm(raw);
  if(rawNorm){
    t = TOPICS.find(t => {
      const n = norm(t.name);
      return n === rawNorm || n.includes(rawNorm) || rawNorm.includes(n);
    });
    if(t) return t;
  }
  return {code:clean||"?", name:"Uncategorised", emoji:"📰"};
}

function slugify(s){
  return String(s||"").replace(/[^a-zA-Z0-9]+/g,"");
}

function newsCardHTML(n){
  const t = safeTopic(n.main);
  const remember = toArray(n.remember);
  const statics = toArray(n.statics);
  const highlights = toArray(n.highlights);   // optional "Key News" bullet list
  const examFocus = toArray(n.examFocus);     // optional "Exam Focus" flashcard lines, e.g. "Label → Value"
  const sub = n.sub || "—";
  const minor = n.minor || "—";
  const footerTitle = n.footerTitle || t.name;
  const hashtags = toArray(n.hashtags).length ? toArray(n.hashtags) : [slugify(t.name), slugify(minor)].filter(Boolean);

  return `
  <article class="story-card" style="--n-color:var(--${t.code});--n-soft:var(--${t.code}-soft)">
    <header class="story-top">
      <div class="story-breadcrumb">
        ${t.emoji} ${t.name}<br>
        <span class="sep">›</span> ${sub} <span class="sep">›</span> ${minor}
      </div>
      <h2 class="story-title">${n.title || "(untitled)"}</h2>
      <div class="story-meta">
        <div class="story-date">🗓️ ${n.date || ""}</div>
        <div class="story-priority">${"⭐".repeat(Number(n.importance)||1)} Priority</div>
      </div>
    </header>

    <div class="story-content">
      <p class="story-lead">${n.body || ""}</p>

      ${highlights.length ? `
      <div class="story-section-label"><span class="bar"></span>📰 Key News</div>
      <ul class="story-list">${highlights.map(h=>`<li>${h}</li>`).join("")}</ul>
      ` : ""}

      <div class="story-box remember">
        <div class="story-box-head"><div class="story-icon">🔑</div><div class="story-box-title">Remember This</div></div>
        <ul>${remember.length ? remember.map(r=>`<li>${r}</li>`).join("") : "<li>—</li>"}</ul>
      </div>

      <div class="story-box static">
        <div class="story-box-head"><div class="story-icon">📌</div><div class="story-box-title">Static Points</div></div>
        <ul>${statics.length ? statics.map(r=>`<li>${r}</li>`).join("") : "<li>—</li>"}</ul>
      </div>

      ${examFocus.length ? `
      <div class="story-divider"></div>
      <div class="story-section-label"><span class="bar"></span>🎯 Exam Focus</div>
      <ul class="story-flash">${examFocus.map(f=>{
        const parts = String(f).split(/→|:/);
        const label = parts[0] ? parts[0].trim() : f;
        const value = parts.slice(1).join(":").trim();
        return `<li><b>${label}${value ? " →" : ""}</b> ${value}</li>`;
      }).join("")}</ul>
      ` : ""}
    </div>

    <footer class="story-footer">
      <strong>${footerTitle}</strong>
      <div class="story-hashtags">${hashtags.map(h=>`<span>#${h}</span>`).join("")}</div>
      ${n.source ? `<div style="margin-top:8px;opacity:.75;">${n.source}</div>` : ""}
    </footer>
  </article>`;
}

  if(state.minor && state.minor !== "__ALL__") return state.minor;
  if(state.sub) return state.sub;

    <div class="news-list">

          catch(err){
            console.error("Failed to render news item:", n, err);

              Could not display story <strong>id: ${n && n.id !== undefined ? n.id : "unknown"}</strong> — check its fields in news.json.

          Try a different month or topic, or use "Show all" to widen the search.
        </div>`}
    </div>
    ${list.length ? `
    <div class="pdf-row">
      <button class="pdf-btn" id="pdfDownloadBtn">📄 Download PDF — Target News of ${label}</button>
    </div>` : ""}
  `;

  const pdfBtn = document.getElementById("pdfDownloadBtn");
  if(pdfBtn){
    pdfBtn.addEventListener("click", ()=>{
      pdfBtn.disabled = true;
      const originalText = pdfBtn.textContent;
      pdfBtn.textContent = "⏳ Building PDF…";

    });
  }
}

/* ======================= PDF EXPORT ======================= */
function generateNewsPDF(list, sectionLabel){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("The PDF library didn't load (check your internet connection) — please try again.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });

  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 16;
  const contentTop = 26;
  const contentBottom = pageH - 18;
  const contentW = pageW - marginX * 2;
  let y = contentTop;
  let pageNum = 1;

  function drawWatermark(){
    doc.setFont("helvetica", "bold");
    doc.setFontSize(56);
    doc.setTextColor(232, 232, 226);
    doc.text("BANKERS ALLIANCE", pageW / 2, pageH / 2, { angle: 45, align: "center" });
  }

  function drawHeader(){
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(18, 54, 38);
    doc.text(`Target News of ${sectionLabel}`, marginX, 15);
    doc.setDrawColor(226, 171, 68);
    doc.setLineWidth(0.6);
    doc.line(marginX, 18, pageW - marginX, 18);
  }

  function drawFooter(){
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(110, 110, 100);
    doc.text("Created by BankersAlliance and Victory Banker", pageW / 2, pageH - 10, { align: "center" });
    doc.text(String(pageNum), pageW - marginX, pageH - 10, { align: "right" });
  }

  function startPage(){
    drawWatermark();
    drawHeader();
    y = contentTop;
  }

  function newPage(){
    drawFooter();
    doc.addPage();
    pageNum++;
    startPage();
  }

  function ensureSpace(neededH){
    if(y + neededH > contentBottom) newPage();
  }

  function writeWrapped(text, x, w, size, color, lineH, bold){
    doc.setFont("helvetica", bold ? "bold" : "normal");
    doc.setFontSize(size);
    doc.setTextColor(color[0], color[1], color[2]);
    const lines = doc.splitTextToSize(text, w);
    lines.forEach(line=>{
      ensureSpace(lineH);
      doc.text(line, x, y);
      y += lineH;
    });
  }

  startPage();

  list.forEach((n, idx)=>{
    const t = safeTopic(n.main);
    const remember = toArray(n.remember);
    const statics = toArray(n.statics);

    ensureSpace(8);
    writeWrapped(`${idx + 1}. ${n.title || "(untitled)"}`, marginX, contentW, 12.5, [18,54,38], 6, true);

    writeWrapped(
      `${t.name}  ›  ${n.sub || "—"}  ›  ${n.minor || "—"}     |     ${n.date || ""}`,
      marginX, contentW, 9, [110,110,100], 5, false
    );
    y += 2;

    if(n.body) writeWrapped(n.body, marginX, contentW, 10.5, [30,36,31], 5.4, false);
    y += 2;

    if(remember.length){
      writeWrapped("Remember This:", marginX, contentW, 10.5, [122,90,16], 5.5, true);
      remember.forEach(pt=> writeWrapped(`•  ${pt}`, marginX + 2, contentW - 4, 10, [30,36,31], 5, false));
      y += 1.5;
    }

    if(statics.length){
      writeWrapped("Static Points:", marginX, contentW, 10.5, [44,77,143], 5.5, true);
      statics.forEach(pt=> writeWrapped(`•  ${pt}`, marginX + 2, contentW - 4, 10, [30,36,31], 5, false));
      y += 1.5;
    }

    ensureSpace(6);
    doc.setDrawColor(222, 222, 212);
    doc.setLineWidth(0.3);
    doc.line(marginX, y, pageW - marginX, y);
    y += 7;
  });

  drawFooter();

  const safeName = String(sectionLabel).replace(/[^a-z0-9]+/gi, "_").toLowerCase();
  doc.save(`ga-pulse-${safeName || "news"}.pdf`);
}

/* ======================= LOAD DATA & BOOT ======================= */
async function loadData(){
  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">⏳ Loading</div>
      <h1>Fetching the latest revision content…</h1>
    </div>`;
  try{
    const res = await fetch("data/news.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const raw = await res.json();
    NEWS = raw.map(n => ({
      ...n,
      month: Number(n.month),
      importance: Number(n.importance) || 1,
      main: String(n.main || "").trim().toUpperCase(),
      remember: toArray(n.remember),
      statics: toArray(n.statics),
    }));
    dataLoaded = true;
    render();
  }catch(err){
    dataError = err;
    console.error("Could not load data/news.json:", err);
    app.innerHTML = `<div class="empty-state"><div class="big">⚠️</div>
      <strong>Could not load news data.</strong><br>
      Make sure <code>data/news.json</code> sits next to this HTML file (same relative folder structure) and that you're viewing this over http(s):// — opening the HTML file directly by double-click blocks fetch() in most browsers due to CORS on the file:// protocol. Hosting on GitHub Pages (or running a local dev server) fixes this automatically.
    </div>`;
  }
}
