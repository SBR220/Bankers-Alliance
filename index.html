<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1a2b">
<title>Bankers Alliance — Current Affairs MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a2b; --paper:#fbf9f5; --paper-2:#ffffff; --line:#e7e2d8; --muted:#726d80;
    --gold:#e2a339; --gold-deep:#b9822a;
    --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#dc2626; --bad-soft:#fdeaea;
    --info:#2f5fdc; --info-soft:#eef3ff;
    --A:#2f5fdc; --A-soft:#e8edff;  --B:#1f9d55; --B-soft:#e5f7ec;
    --C:#8b3fd6; --C-soft:#f2e9fb;  --D:#d64545; --D-soft:#fdeaea;
    --E:#e07b1a; --E-soft:#fdf0e0;  --F:#0e9488; --F-soft:#e2f6f4;
    --G:#d6318a; --G-soft:#fbe6f1;  --H:#a6791f; --H-soft:#f7f0dd;
    --Z:#6b7280; --Z-soft:#eef0f3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.5;
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Baloo 2',cursive;font-weight:700;margin:0;letter-spacing:.2px;}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  button:disabled{cursor:not-allowed;}
  ::selection{background:var(--gold);color:#fff;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}

  /* ---------- top bar : only Home + Back ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--paper-2);border-bottom:2px solid var(--line);
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:8px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2rem;}
  .brand .dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%;background:conic-gradient(from 90deg,var(--A),var(--E),var(--G),var(--F),var(--A));}
  .brand #brandText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spacer{display:none;}
  .nav-btn{
    border:2px solid var(--ink);background:#fff;color:var(--ink);padding:8px 16px;border-radius:100px;
    font-weight:700;font-size:.9rem;white-space:nowrap;transition:.15s;
  }
  .nav-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-deep);}
  .nav-btn.back-btn{background:var(--ink);color:#fff;}
  .nav-btn.back-btn:hover:not(:disabled){background:#000;border-color:#000;color:#fff;}
  .nav-btn:disabled{opacity:.35;pointer-events:none;}
  @media(max-width:480px){
    .topbar{padding-left:12px;padding-right:12px;gap:6px;}
    .brand{font-size:1.02rem;gap:8px;}
    .nav-btn{padding:7px 12px;font-size:.82rem;}
  }
  @media(max-width:340px){.nav-btn .lbl{display:none;}}

  .shell{max-width:1120px;margin:0 auto;padding:26px 18px 110px;}
  .view{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .hero{margin-bottom:22px;}
  .eyebrow{font-weight:800;color:var(--gold-deep);font-size:.92rem;margin-bottom:4px;}
  .hero h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;margin-bottom:6px;}
  .hero p{color:var(--muted);margin:0;max-width:640px;}

  .section-label{font-weight:800;font-size:1.05rem;margin:30px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tag{font-size:.72rem;font-weight:700;color:var(--muted);border:1.5px dashed var(--line);border-radius:100px;padding:3px 10px;}

  /* ---------- buttons ---------- */
  .btn{
    border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:100px;
    padding:11px 22px;font-weight:800;font-size:.95rem;transition:.15s;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);}
  .btn.primary{background:var(--ink);color:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.45);}
  .btn:disabled{opacity:.4;}
  .btn-sm{border:1.5px solid var(--ink);background:#fff;border-radius:100px;padding:6px 14px;font-weight:700;font-size:.82rem;}
  .btn-sm:hover{background:var(--ink);color:#fff;}
  .wide-btn{
    width:100%;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:16px;
    padding:14px 18px;font-weight:800;font-size:1rem;text-align:center;transition:.15s;
  }
  .wide-btn:hover:not(:disabled){transform:translateY(-2px);}
  .wide-btn:disabled{opacity:.35;}

  /* ---------- home : months ---------- */
  .month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.month-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:560px){.month-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
  .month-btn{
    position:relative;overflow:hidden;text-align:left;background:var(--paper-2);border:2px solid var(--line);
    border-radius:18px;padding:20px 14px 16px;transition:.15s;
  }
  .month-btn:hover:not(:disabled){transform:translateY(-3px);border-color:var(--m-color);}
  .month-btn .stripe{position:absolute;top:0;left:0;right:0;height:6px;background:var(--m-color);}
  .month-btn .mnum{font-size:.74rem;color:var(--muted);font-weight:700;}
  .month-btn .mname{font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:700;}
  .month-btn .mcount{margin-top:8px;display:inline-block;font-size:.76rem;font-weight:800;background:var(--m-soft);color:var(--m-color);padding:3px 10px;border-radius:100px;}
  .month-btn:disabled{opacity:.45;}
  .month-btn.all{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;}
  .month-btn.all .stripe{background:conic-gradient(from 0deg,var(--A),var(--E),var(--G),var(--F),var(--A));height:6px;}

  .rev-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:560px){.rev-grid{grid-template-columns:1fr;}}
  .rev-tile{
    display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper-2);border:2px solid var(--line);
    border-radius:16px;padding:14px 16px;transition:.15s;
  }
  .rev-tile:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px);}
  .rev-tile:disabled{opacity:.45;}
  .rev-tile .ico{font-size:1.6rem;}
  .rev-tile b{display:block;font-weight:800;}
  .rev-tile span{font-size:.82rem;color:var(--muted);font-weight:600;}
  .continue{
    width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:14px;
    background:linear-gradient(135deg,#1c1a2b,#2b2750);color:#fff;border:none;border-radius:16px;padding:14px 18px;
    box-shadow:0 12px 26px -14px rgba(28,26,43,.7);
  }
  .continue .ico{font-size:1.5rem;}
  .continue b{display:block;font-weight:800;}
  .continue span{font-size:.82rem;opacity:.8;font-weight:600;}

  .log-list{display:flex;flex-direction:column;gap:8px;}
  .log-item{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;}
  .log-item .nm{flex:1;min-width:0;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .log-item .nm small{display:block;color:var(--muted);font-weight:600;font-size:.76rem;}
  .pill{font-weight:800;font-size:.82rem;border-radius:100px;padding:4px 12px;white-space:nowrap;}
  .pill.g{background:var(--ok-soft);color:#0f7a37;} .pill.y{background:#fff4d6;color:#8a6314;} .pill.r{background:var(--bad-soft);color:#b42323;}

  /* ---------- topic cards & chips ---------- */
  .topic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:900px){.topic-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.topic-grid{grid-template-columns:1fr;}}
  .topic-card{
    border:2px solid var(--line);border-radius:16px;background:var(--paper-2);padding:16px 16px 14px;text-align:left;
    transition:.15s;display:flex;flex-direction:column;gap:8px;
  }
  .topic-card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--t-color);}
  .topic-card:disabled{opacity:.45;}
  .topic-card .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;background:var(--t-soft);}
  .topic-card .tname{font-weight:800;font-size:1rem;line-height:1.25;}
  .topic-card .tmeta{font-size:.75rem;color:var(--t-color);font-weight:800;}
  .weight-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
  .weight-bar>i{display:block;height:100%;background:var(--t-color);}
  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}
  .topic-chip{
    max-width:100%;text-align:left;
    border:1.5px solid var(--t-color);background:var(--t-soft);color:color-mix(in srgb,var(--t-color) 70%,#000 30%);
    padding:10px 16px;border-radius:100px;font-weight:800;font-size:.88rem;transition:.15s;
  }
  .topic-chip:hover:not(:disabled){transform:translateY(-2px);}
  .topic-chip:disabled{opacity:.4;border-style:dashed;}

  /* ---------- overview ---------- */
  .panel{background:var(--paper-2);border:2px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:18px;}
  .panel-h{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.1rem;margin-bottom:10px;}
  .panel p{margin:0 0 12px;color:var(--muted);font-size:.92rem;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line);}
  .row:last-of-type{border-bottom:none;}
  .row-l{font-weight:800;font-size:.92rem;}
  .row-l small{display:block;color:var(--muted);font-weight:600;font-size:.76rem;}
  .seg{display:inline-flex;border:2px solid var(--ink);border-radius:100px;overflow:hidden;flex-wrap:wrap;}
  .seg button{border:none;background:#fff;padding:8px 14px;font-weight:800;font-size:.84rem;}
  .seg button+button{border-left:2px solid var(--ink);}
  .seg button.on{background:var(--ink);color:#fff;}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .cta-row .btn{flex:1 1 180px;}
  .mini-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .mini-chips span{background:var(--paper);border:1.5px solid var(--line);border-radius:100px;padding:4px 12px;font-size:.8rem;font-weight:700;}
  .mini-chips span b{color:var(--gold-deep);}
  .empty{border:2px dashed var(--line);border-radius:18px;padding:38px 22px;text-align:center;color:var(--muted);}
  .empty .big{font-size:2.2rem;margin-bottom:6px;}

  /* ---------- quiz ---------- */
  .quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .quiz-title{flex:1 1 220px;min-width:0;font-family:'Baloo 2',cursive;font-weight:700;font-size:1.15rem;line-height:1.2;}
  @media(max-width:600px){.quiz-title{flex-basis:100%;}}
  .quiz-title small{display:block;font-family:'Manrope',sans-serif;font-weight:700;color:var(--muted);font-size:.76rem;}
  .mode-pill{font-size:.74rem;font-weight:800;border-radius:100px;padding:4px 10px;background:var(--info-soft);color:var(--info);}
  .timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:.92rem;background:var(--paper-2);border:1.5px solid var(--line);border-radius:100px;padding:4px 12px;}
  .progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:14px;}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .3s;}
  .done-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--ok-soft);border:1.5px solid var(--ok);color:#0f6a31;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:800;font-size:.92rem;
  }
  .quiz-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;}
  .quiz-wrap>div{min-width:0;}
  @media(min-width:980px){.quiz-wrap{grid-template-columns:minmax(0,1fr) 290px;align-items:start;}}

  .qcard{min-width:0;max-width:100%;background:var(--paper-2);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(18,24,40,.4),0 4px 12px -6px rgba(0,0,0,.1);}
  .qhead{
    position:relative;color:#fff;padding:12px 16px 14px;
    background:var(--n-color);
    background:linear-gradient(135deg,color-mix(in srgb,var(--n-color) 88%,#06110c 12%) 0%,color-mix(in srgb,var(--n-color) 52%,#0b1220 48%) 100%);
  }
  .qhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--n-color) 55%,var(--gold));}
  .qhead-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .qnum{font-family:'Fraunces',serif;font-weight:700;font-size:1.25rem;}
  .qnum small{font-size:.8rem;opacity:.75;font-weight:600;}
  .qbadge{font-size:.74rem;font-weight:800;border-radius:100px;padding:3px 10px;background:rgba(255,255,255,.2);}
  .qbadge.ok{background:#fff;color:#0f7a37;} .qbadge.bad{background:#fff;color:#b42323;} .qbadge.skip{background:#fff;color:#6b6b6b;}
  .star{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:34px;height:34px;font-size:1.1rem;line-height:1;}
  .star.on{background:#fff;color:var(--gold-deep);}
  .qpath{margin-top:6px;font-size:.78rem;font-weight:700;color:#fbe9c4;line-height:1.45;opacity:.95;}
  .qpath span{opacity:.7;margin:0 3px;}
  .qbody{padding:18px 18px 20px;}
  .qlabel{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.8px;color:var(--gold-deep);background:#fff4d6;border-radius:100px;padding:3px 12px;margin-bottom:10px;}
  .passage{
    background:#fffaf0;border:1.5px solid #f0dfb2;border-left:5px solid var(--gold);border-radius:12px;
    padding:12px 16px;margin:0 0 14px;font-size:.98rem;line-height:1.65;overflow-x:auto;
  }
  .passage-h{font-size:.74rem;font-weight:800;color:var(--gold-deep);margin-bottom:6px;letter-spacing:.4px;}
  .passage p,.sol-b p{margin:0 0 .6em;} .passage p:last-child,.sol-b p:last-child{margin-bottom:0;}
  .qtext{font-size:1.08rem;font-weight:700;line-height:1.55;margin:0 0 14px;overflow-wrap:anywhere;overflow-x:auto;}
  .passage,.sol-b,.fb{overflow-wrap:anywhere;}
  .sol-b{overflow-x:auto;}
  .passage table,.qtext table,.sol-b table,.opt-text table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0;}
  .passage th,.passage td,.qtext th,.qtext td,.sol-b th,.sol-b td{border:1px solid #d9cfb4;padding:6px 9px;text-align:left;}
  .passage th,.qtext th,.sol-b th{background:#f6edd5;}
  .qbody img{max-width:100%;height:auto;border-radius:8px;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
    border-radius:14px;padding:12px 14px;font-size:1rem;font-weight:600;line-height:1.45;transition:.15s;color:var(--ink);
  }
  .opt:hover:not(:disabled){border-color:var(--n-color,var(--ink));transform:translateX(2px);}
  .opt:disabled{color:var(--ink);}
  .opt-key{flex:0 0 32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem;}
  .opt-text{flex:1;min-width:0;padding-top:3px;overflow-wrap:anywhere;}
  .opt-mark{flex:0 0 auto;font-weight:800;font-size:.8rem;padding-top:4px;}
  .opt.selected{border-color:var(--info);background:var(--info-soft);}
  .opt.selected .opt-key{background:var(--info);border-color:var(--info);color:#fff;}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft);}
  .opt.correct .opt-key{background:var(--ok);border-color:var(--ok);color:#fff;}
  .opt.correct .opt-mark{color:var(--ok);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s;}
  .opt.wrong .opt-key{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt.wrong .opt-mark{color:var(--bad);}
  .opt.dim{opacity:.55;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .clear-row{margin-top:10px;text-align:right;}

  .fb{margin-top:16px;border-radius:14px;padding:12px 16px;font-weight:800;line-height:1.45;}
  .fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok);color:#0f6a31;}
  .fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad);color:#a31f1f;}
  .fb.skip{background:#f1f1ee;border:1.5px solid #cfcfc8;color:#55554f;}
  .sol{margin-top:12px;border-radius:14px;border:1.5px solid #e3b23c;background:linear-gradient(175deg,#fdf1d2,#fff8e8);padding:12px 16px 14px;}
  .sol-h{font-family:'Fraunces',serif;font-weight:700;color:#7a5a10;margin-bottom:6px;}
  .sol-b{font-size:.96rem;line-height:1.65;color:#41403a;}

  .palette{background:var(--paper-2);border:2px solid var(--line);border-radius:18px;padding:14px;}
  .pal-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;}
  .pal-head span{font-size:.8rem;color:var(--muted);}
  .pal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .pal-btn{position:relative;aspect-ratio:1;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:800;font-size:.85rem;padding:0;}
  .pal-btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;}
  .pal-btn.bad{background:var(--bad);border-color:var(--bad);color:#fff;}
  .pal-btn.ans{background:var(--info);border-color:var(--info);color:#fff;}
  .pal-btn.cur{outline:3px solid var(--gold);outline-offset:1px;}
  .pal-btn i{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:.7rem;color:var(--gold-deep);text-shadow:0 0 3px #fff;}
  .pal-legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:.72rem;font-weight:700;color:var(--muted);}
  .pal-legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
  .palette .btn{width:100%;}
  .sheet-backdrop{display:none;}
  @media(max-width:979px){
    .palette{
      position:fixed;left:0;right:0;bottom:0;z-index:60;border-radius:22px 22px 0 0;max-height:72vh;overflow:auto;
      padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
      transform:translateY(110%);transition:transform .25s ease;box-shadow:0 -14px 44px rgba(0,0,0,.28);
    }
    .palette.open{transform:none;}
    .sheet-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
  }
  @media(min-width:980px){.palette{position:sticky;top:76px;} .pal-toggle{display:none!important;}}

  .qnav{
    position:sticky;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,var(--paper) 72%,rgba(251,249,245,0));
  }
  .qnav .btn{padding:12px 20px;} .qnav .btn:first-child,.qnav .btn:last-child{min-width:108px;}
  @media(max-width:420px){
    .qnav{gap:6px;} .qnav .btn{padding:11px 12px;font-size:.88rem;}
    .qnav .btn:first-child,.qnav .btn:last-child{min-width:0;}
  }

  /* ---------- result ---------- */
  .result-hero{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;color:#fff;border-radius:24px;padding:26px 22px;
    background:radial-gradient(circle at 18px 18px,rgba(255,255,255,.08) 1.5px,transparent 1.6px) 0 0/26px 26px,linear-gradient(135deg,#1c1a2b,#2b2750 60%,#3b2f6b);
    box-shadow:0 24px 50px -26px rgba(28,26,43,.8);
  }
  .donut{width:150px;height:150px;flex:0 0 auto;}

  .result-txt{flex:1 1 220px;min-width:200px;}

  .result-txt .big{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:800;line-height:1;}
  .result-txt .big small{font-size:1.1rem;opacity:.75;font-weight:600;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
  @media(min-width:760px){.stat-grid{grid-template-columns:repeat(6,1fr);}}
  .stat{background:var(--paper-2);border:2px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;}

  .stat span{font-size:.72rem;font-weight:800;color:var(--muted);}
  .stat.ok b{color:var(--ok);} .stat.bad b{color:var(--bad);} .stat.skip b{color:#7b7b73;}
  .bars{display:flex;flex-direction:column;gap:12px;}
  .bar-row .bar-h{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.88rem;margin-bottom:4px;}

  .bar-track i{display:block;height:100%;} .bar-track .o{background:var(--ok);} .bar-track .b{background:var(--bad);} .bar-track .s{background:#c9c9c0;}
  .result-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;}
  @media(min-width:760px){.result-actions{grid-template-columns:repeat(3,1fr);}}
  .result-actions .btn{width:100%;padding:12px 8px;font-size:.88rem;}

  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .review-list{display:flex;flex-direction:column;gap:22px;}

  .toast{
    position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;
    background:var(--ink);color:#fff;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:100px;
    opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span><span id="brandText">Bankers Alliance</span></div>
  <div class="spacer"></div>
  <button class="nav-btn" id="homeBtn" aria-label="Home">🏠<span class="lbl"> Home</span></button>
  <button class="nav-btn back-btn" id="backBtn" aria-label="Back">←<span class="lbl"> Back</span></button>
</div>

<main class="shell" id="app"><div class="empty"><div class="big">⏳</div>Loading questions…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Please enable JavaScript to use this site.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

/* =====================================================================
   CONFIG — easy things to change
   ===================================================================== */
const BRAND = "Bankers Alliance";
const YEAR = 2026;                                   // shown next to month names
const NEG_MARK = 0.25;                               // marks deducted per wrong answer (if enabled)
const PDF_HEADER_PREFIX = "Target MCQs of";          // PDF header = prefix + section name
const PDF_FOOTER_TEXT = "Created by BankersAlliance and Victory Banker";
const PDF_WATERMARK = "BANKERS ALLIANCE";
const OTHER_CODE = "Z";
const COUNT_CHOICES = [10, 20, 30, 50];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_COLORS = ["#2f5fdc","#1f9d55","#8b3fd6","#d64545","#e07b1a","#0e9488","#d6318a","#a6791f","#2f5fdc","#1f9d55","#8b3fd6","#d64545"];

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app"), homeBtn = $("#homeBtn"), backBtn = $("#backBtn"), toastEl = $("#toast");
$("#brandText").textContent = BRAND;
document.title = BRAND + " — Current Affairs MCQ Practice";

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().replace(/&/g," ").replace(/[^a-z0-9]+/g," ").trim();
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  const p = n => String(n).padStart(2,"0");
  return h ? h+":"+p(m)+":"+p(s) : p(m)+":"+p(s);
}
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("ga:"+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("ga:"+k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("show"), 2300);
}

/* ---------- safe HTML: question text may contain <b>, <u>, <mark>, tables … ---------- */
const ALLOWED = new Set(["B","STRONG","I","EM","U","MARK","BR","P","SPAN","SUB","SUP","UL","OL","LI","TABLE","THEAD","TBODY","TR","TH","TD","CAPTION","IMG","DIV","S","SMALL","BLOCKQUOTE","CODE"]);
const DROP = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","FORM","INPUT","BUTTON","SVG","MATH","TEXTAREA","SELECT"]);
const sanitizeCache = new Map();
function sanitize(html){
  const key = String(html == null ? "" : html);
  if(sanitizeCache.has(key)) return sanitizeCache.get(key);
  const cleaned = key.replace(/&#0*8203;|&#x0*200b;|[\u200b\ufeff]/gi, "");
  const doc = new DOMParser().parseFromString("<body>" + cleaned + "</body>", "text/html");
  (function walk(node){
    Array.from(node.childNodes).forEach(ch => {
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ ch.remove(); return; }
      if(DROP.has(ch.tagName)){ ch.remove(); return; }
      if(!ALLOWED.has(ch.tagName)){
        walk(ch);
        while(ch.firstChild) node.insertBefore(ch.firstChild, ch);
        ch.remove(); return;
      }
      Array.from(ch.attributes).forEach(a => {
        const n = a.name.toLowerCase();
        const keep = (ch.tagName === "IMG" && (n === "src" || n === "alt")) ||
                     ((ch.tagName === "TD" || ch.tagName === "TH") && (n === "colspan" || n === "rowspan"));
        if(!keep) ch.removeAttribute(a.name);
      });
      if(ch.tagName === "IMG"){
        const src = ch.getAttribute("src") || "";
        if(!/^(https?:\/\/|data:image\/(png|jpe?g|gif|webp);|\/|\.\/|[\w-]+\/)/i.test(src)){ ch.remove(); return; }
        ch.setAttribute("loading", "lazy");
      }
      walk(ch);
    });
  })(doc.body);
  const out = doc.body.innerHTML;
  sanitizeCache.set(key, out);
  return out;
}
/* HTML -> plain text (used by the PDF); keeps line breaks and table rows readable */
function htmlToText(html){
  const h = String(html == null ? "" : html)
    .replace(/<\s*br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n\n").replace(/<\/(div|li|tr|h\d|blockquote)>/gi, "\n")
    .replace(/<\/(td|th)>/gi, " | ");
  const doc = new DOMParser().parseFromString("<body>" + h + "</body>", "text/html");
  return doc.body.textContent.replace(/[\u200b\ufeff\u00a0]/g, " ").replace(/ \| \n/g, "\n")
    .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
/* jsPDF's built-in fonts only know Latin-1 – swap or drop anything else so nothing prints as garbage */
const PDF_SWAP = {"₹":"Rs. ","→":"->","←":"<-","↔":"<->","≥":">=","≤":"<=","≈":"~","≠":"!=","✓":"","✔":"","✗":"","✘":"","−":"-","‑":"-","\u2009":" ","\u202f":" "};
const PDF_OK = new Set([0x2013,0x2014,0x2018,0x2019,0x201C,0x201D,0x2022,0x2026,0x2039,0x203A,0x20AC,0x2122]);
function pdfSafe(text){
  let t = String(text == null ? "" : text).replace(/₹\s*/g, "Rs. ").replace(/[→←↔≥≤≈≠✓✔✗✘−‑\u2009\u202f]/g, c => PDF_SWAP[c]);
  return Array.from(t).filter(ch => { const c = ch.codePointAt(0); return c === 10 || (c >= 32 && c <= 0xFF) || PDF_OK.has(c); }).join("");
}

/* =====================================================================
   STATE
   ===================================================================== */
let TOPICS = [], Q = [];
const QBYID = new Map();
let bookmarks = new Set(LS.get("bookmarks", []));
let mistakes  = new Set(LS.get("mistakes", []));
let log       = LS.get("log", []);
let sessions  = LS.get("sessions", {});
let prefs     = Object.assign({mode:"practice", shuffle:false, neg:false, count:0}, LS.get("prefs", {}));
let nav       = [{v:"home", scope:{}}];
let session   = null;
const ui      = {paletteOpen:false, reviewFilter:"all"};

const topicByCode = c => TOPICS.find(t => t.code === c);
const topicOf = q => topicByCode(q.main) || {code:OTHER_CODE, name:"Other", emoji:"🗂️"};
const monthLabel = m => m == null ? "All Months" : MONTHS[m] + " " + YEAR;
const cur = () => nav[nav.length-1];

/* ---------- data preparation ---------- */
function ensureOther(){
  let t = TOPICS.find(t => t.code === OTHER_CODE);
  if(!t){ t = {code:OTHER_CODE, name:"Other / Unsorted", weight:0, emoji:"🗂️", subs:[{name:"Unsorted", weight:0, emoji:"🏷️", minors:[]}]}; TOPICS.push(t); }
  return t;
}
function prepareData(raw){
  Q = (Array.isArray(raw) ? raw : []).filter(q => q && q.options && q.answer).map(q => ({
    id: String(q.id), month: Number(q.month), main: String(q.main || "").trim().toUpperCase(),
    sub: String(q.sub || "").trim(), minor: String(q.minor || q.tag || "General").trim(), tag: q.tag || "",
    passage: q.passage || "", question: q.question || "", options: q.options,
    answer: String(q.answer).trim().toUpperCase(), solution: q.solution || ""
  }));
  Q.forEach(q => {
    let top = topicByCode(q.main);
    if(!top){ top = ensureOther(); q.main = OTHER_CODE; if(!q.sub) q.sub = "Unsorted"; }
    let sub = top.subs.find(s => norm(s.name) === norm(q.sub));
    if(!sub){ sub = {name:q.sub || "General", weight:0, emoji:"🏷️", minors:[]}; top.subs.push(sub); }
    q.sub = sub.name;
    QBYID.set(q.id, q);
  });
}
function filterQ(sc){
  sc = sc || {};
  return Q.filter(q => {
    if(sc.special === "saved" && !bookmarks.has(q.id)) return false;
    if(sc.special === "mistakes" && !mistakes.has(q.id)) return false;
    if(sc.month != null && q.month !== sc.month) return false;
    if(sc.main && q.main !== sc.main) return false;
    if(sc.sub && q.sub !== sc.sub) return false;
    if(sc.minor && q.minor !== sc.minor) return false;
    return true;
  });
}
function minorsFor(main, sub){
  const top = topicByCode(main); const s = top && top.subs.find(x => x.name === sub);
  const list = s ? s.minors.slice() : [];
  Q.forEach(q => { if(q.main === main && q.sub === sub && !list.includes(q.minor)) list.push(q.minor); });
  return list;
}
const scopeKey = sc => [sc.special||"", sc.month == null ? "" : sc.month, sc.main||"", sc.sub||"", sc.minor||""].join("|");
function scopeTitle(sc){
  if(sc.special === "saved") return "⭐ Saved Questions";
  if(sc.special === "mistakes") return "🔁 My Mistakes";
  if(sc.minor) return sc.minor;
  if(sc.sub) return sc.sub;
  if(sc.main){ const t = topicByCode(sc.main); return t ? t.name : sc.main; }
  return monthLabel(sc.month);
}
function pdfSection(sc){
  const t = scopeTitle(sc).replace(/^[^\w]+/, "");
  if(sc.special) return t;
  return (sc.main || sc.sub || sc.minor) && sc.month != null ? t + " (" + monthLabel(sc.month) + ")" : t;
}
const effCount = n => (prefs.count && prefs.count < n) ? prefs.count : 0;
/* statement-style questions often have just a label such as "STATEMENT BASED QUESTION" */
function qLabelOnly(q){
  const t = htmlToText(q.question);
  return q.passage && t && t.length <= 60 && t === t.toUpperCase() && /[A-Z]/.test(t) ? t : "";
}

/* =====================================================================
   NAVIGATION  (integrates with the phone's / browser's Back button)
   ===================================================================== */
function pushView(v, scope){ nav.push({v, scope: scope || {}}); history.pushState({d: nav.length-1}, ""); ui.paletteOpen = false; render(); }
function replaceTop(v, scope){ nav[nav.length-1] = {v, scope: scope || {}}; history.replaceState({d: nav.length-1}, ""); ui.paletteOpen = false; render(); }
function goBack(){ if(nav.length > 1) history.back(); }
function goHome(){ const k = nav.length - 1; if(k > 0) history.go(-k); else render(); }
window.addEventListener("popstate", e => {
  const d = e.state && typeof e.state.d === "number" ? e.state.d : 0;
  if(d > nav.length - 1) nav = [nav[0]]; else while(nav.length > d + 1) nav.pop();
  ui.paletteOpen = false; render();
});
history.replaceState({d:0}, "");
homeBtn.addEventListener("click", goHome);
backBtn.addEventListener("click", goBack);

/* =====================================================================
   VIEWS : home → months → topics → subtopics → minor topics → overview
   ===================================================================== */
function render(keepScroll){
  const v = cur();
  homeBtn.disabled = backBtn.disabled = (v.v === "home");
  try{
    if((v.v === "quiz" || v.v === "result" || v.v === "review") && !session){ nav = [nav[0]]; history.replaceState({d:0}, ""); viewHome(); }
    else switch(v.v){
      case "home": viewHome(); break;
      case "topics": viewTopics(v.scope); break;
      case "subs": viewSubs(v.scope); break;
      case "minors": viewMinors(v.scope); break;
      case "overview": viewOverview(v.scope); break;
      case "quiz": viewQuiz(); break;
      case "result": viewResult(); break;
      case "review": viewReview(); break;
    }
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="empty"><div class="big">⚠️</div><b>Something went wrong showing this screen.</b><br>${esc(err.message)}<br><br><button class="btn primary" data-action="home">🏠 Go Home</button></div>`;
  }
  if(!keepScroll) window.scrollTo(0, 0);
}

function viewHome(){
  const counts = MONTHS.map((_, i) => Q.filter(q => q.month === i).length);
  const open = Object.values(sessions).filter(s => s && !s.finished && s.ids && s.ids.length)
                     .sort((a, b) => (b.updatedAt||0) - (a.updatedAt||0));
  const cont = open[0];
  const recent = log.slice(0, 5);
  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">📅 Pick a month to begin</div>
      <h1>Practice Current Affairs MCQs</h1>
      <p>${Q.length ? plural(Q.length, "question") + " ready. " : ""}Choose a month, drill down by topic, answer and learn from instant explanations.</p>
    </div>
    ${cont ? `<button class="continue" data-action="resume-key" data-key="${esc(cont.key)}"><span class="ico">▶️</span><div><b>Continue: ${esc(cont.label)}</b><span>${Object.keys(cont.answers||{}).length}/${cont.ids.length} answered · ${esc(cont.mode === "test" ? "Test mode" : "Practice mode")}</span></div></button>` : ""}
    ${Q.length ? "" : `<div class="empty"><div class="big">🗂️</div><b>No questions found yet.</b><br>Add MCQ text files to <code>data/raw/</code> and run the converter (see README).</div>`}
    <div class="month-grid">
      <button class="month-btn all" data-action="month" data-m="all" ${Q.length ? "" : "disabled"} style="--m-color:#1c1a2b;--m-soft:#ececf3">
        <div class="stripe"></div><div><div class="mnum">EVERYTHING</div><div class="mname">All Months</div></div><span class="mcount">${plural(Q.length, "question")}</span>
      </button>
      ${MONTHS.map((m, i) => `
        <button class="month-btn" data-action="month" data-m="${i}" ${counts[i] ? "" : "disabled"} style="--m-color:${MONTH_COLORS[i]};--m-soft:${MONTH_COLORS[i]}22">
          <div class="stripe"></div><div class="mnum">${String(i+1).padStart(2,"0")} · ${YEAR}</div><div class="mname">${m}</div>
          <span class="mcount">${counts[i] ? plural(counts[i], "question") : "No questions yet"}</span>
        </button>`).join("")}
    </div>
    <div class="section-label">🧠 My Revision</div>
    <div class="rev-grid">
      <button class="rev-tile" data-action="special" data-kind="saved" ${bookmarks.size ? "" : "disabled"}><span class="ico">⭐</span><div><b>Saved Questions</b><span>${plural(filterQ({special:"saved"}).length, "question")} bookmarked</span></div></button>
      <button class="rev-tile" data-action="special" data-kind="mistakes" ${mistakes.size ? "" : "disabled"}><span class="ico">🔁</span><div><b>My Mistakes</b><span>${plural(filterQ({special:"mistakes"}).length, "question")} to revisit</span></div></button>
    </div>
    ${recent.length ? `
      <div class="section-label">📈 Recent Results <button class="btn-sm" data-action="clear-log">Clear</button></div>
      <div class="log-list">${recent.map(r => `
        <div class="log-item"><div class="nm">${esc(r.label)}<small>${new Date(r.ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})} · ${esc(r.mode === "test" ? "Test" : "Practice")} · ${fmtTime(r.secs)}</small></div>
          <div style="font-weight:800">${r.correct}/${r.total}</div><span class="pill ${r.pct >= 75 ? "g" : r.pct >= 50 ? "y" : "r"}">${Math.round(r.pct)}%</span></div>`).join("")}</div>` : ""}`;
}

function topicCard(action, attrs, code, emoji, name, meta, pct, count){
  return `<button class="topic-card" data-action="${action}" ${attrs} ${count ? "" : "disabled"} style="--t-color:var(--${code});--t-soft:var(--${code}-soft)">
    <div class="icon">${emoji}</div><div class="tname">${esc(name)}</div><div class="tmeta">${meta}</div>
    <div class="weight-bar"><i style="width:${Math.min(100, pct)}%"></i></div></button>`;
}
function viewTopics(sc){
  const ml = monthLabel(sc.month), total = filterQ({month: sc.month}).length;
  app.innerHTML = `
    <div class="hero"><div class="eyebrow">🗂️ ${esc(ml)}</div><h1>Choose a Main Topic</h1>
      <p>The bar shows each topic's approximate exam weightage. Topics without questions are greyed out.</p></div>
    <button class="wide-btn" data-action="practice" ${total ? "" : "disabled"}>▶ Practice all ${plural(total, "question")} of ${esc(ml)}</button>
    <div class="section-label">Main Topics <span class="tag">${TOPICS.length} categories</span></div>
    <div class="topic-grid">${TOPICS.map(t => {
      const c = filterQ({month: sc.month, main: t.code}).length;
      return topicCard("topic", `data-code="${t.code}"`, t.code, t.emoji, t.name,
        `${t.weight ? t.weight + "% weightage · " : ""}${plural(c, "question")}`, t.weight * 3, c);
    }).join("")}</div>`;
}
function viewSubs(sc){
  const t = topicByCode(sc.main); const total = filterQ(sc).length;
  app.innerHTML = `
    <div class="hero"><div class="eyebrow">${t.emoji} ${esc(t.name)} · ${esc(monthLabel(sc.month))}</div><h1>Choose a Subtopic</h1>
      <p>Subtopic weightage is relative to ${esc(t.name)}.</p></div>
    <button class="wide-btn" data-action="practice" ${total ? "" : "disabled"}>▶ Practice all ${plural(total, "question")} of ${esc(t.name)}</button>
    <div class="section-label">Subtopics <span class="tag">${t.subs.length} in this topic</span></div>
    <div class="topic-grid">${t.subs.map(s => {
      const c = filterQ({month: sc.month, main: sc.main, sub: s.name}).length;
      return topicCard("sub", `data-sub="${encodeURIComponent(s.name)}"`, t.code, s.emoji, s.name,
        `${s.weight ? s.weight + "% of topic · " : ""}${plural(c, "question")}`, s.weight || (c ? 100 : 0), c);
    }).join("")}</div>`;
}
function viewMinors(sc){
  const t = topicByCode(sc.main); const s = t.subs.find(x => x.name === sc.sub);
  const total = filterQ(sc).length;
  const chips = minorsFor(sc.main, sc.sub).map(m => ({m, c: filterQ({...sc, minor: m}).length}))
                  .sort((a, b) => (b.c > 0) - (a.c > 0));
  app.innerHTML = `
    <div class="hero"><div class="eyebrow">${t.emoji} ${esc(t.name)} › ${s ? s.emoji : ""} ${esc(sc.sub)}</div><h1>Pick a Minor Topic</h1>
      <p>Choose a specific minor topic, or practise the whole subtopic at once.</p></div>
    <button class="wide-btn" data-action="practice" ${total ? "" : "disabled"}>▶ Practice all ${plural(total, "question")} of ${esc(sc.sub)}</button>
    <div class="section-label">Minor Topics <span class="tag">${chips.length} tags</span></div>
    <div class="chip-row">${chips.map(x => `
      <button class="topic-chip" data-action="minor" data-minor="${encodeURIComponent(x.m)}" ${x.c ? "" : "disabled"} style="--t-color:var(--${t.code});--t-soft:var(--${t.code}-soft)">${esc(x.m)} (${x.c})</button>`).join("")}</div>`;
}

function segRow(label, hint, k, opts, val){
  return `<div class="row"><div class="row-l">${label}${hint ? `<small>${hint}</small>` : ""}</div>
    <div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v, t]) =>
      `<button class="${String(v) === String(val) ? "on" : ""}" data-action="pref" data-k="${k}" data-v="${v}">${t}</button>`).join("")}</div></div>`;
}
function viewOverview(sc){
  const list = filterQ(sc), n = list.length, key = scopeKey(sc);
  const saved = sessions[key] && !sessions[key].finished ? sessions[key] : null;
  const past = log.filter(r => r.key === key);
  const best = past.length ? Math.max(...past.map(r => r.pct)) : null;
  const byMinor = {}; list.forEach(q => { byMinor[q.minor] = (byMinor[q.minor] || 0) + 1; });
  const mc = Object.entries(byMinor).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const counts = COUNT_CHOICES.filter(c => c < n).map(c => [c, c]);
  const eff = effCount(n);
  app.innerHTML = `
    <div class="hero"><div class="eyebrow">${esc(sc.special ? "🧠 My Revision" : (scopeTitle(sc) === monthLabel(sc.month) ? "🎯 Practice set" : "📅 " + monthLabel(sc.month)))}</div>
      <h1>${esc(scopeTitle(sc))}</h1>
      <p>${n ? plural(n, "question") + " in this set." : "No questions in this set yet."}${best != null ? " Best score so far: <b>" + Math.round(best) + "%</b> (" + plural(past.length, "attempt") + ")." : ""}</p></div>
    ${n ? `
    <div class="panel">
      <div class="panel-h">⚙️ Set up your practice</div>
      ${segRow("Mode", prefs.mode === "practice" ? "See right / wrong + explanation after every answer" : "No feedback until the end, then full review", "mode", [["practice","📘 Practice"],["test","📝 Test"]], prefs.mode)}
      ${counts.length ? segRow("Questions", "Take a random subset", "count", [["0", "All " + n], ...counts], eff) : ""}
      ${segRow("Shuffle", "Random question order", "shuffle", [["0","Off"],["1","On"]], prefs.shuffle ? "1" : "0")}
      ${segRow("Negative marking", "Deduct ¼ mark per wrong answer", "neg", [["0","Off"],["1","−¼"]], prefs.neg ? "1" : "0")}
      <div class="cta-row">
        ${saved ? `<button class="btn primary" data-action="resume">▶ Resume (${Object.keys(saved.answers).length}/${saved.ids.length})</button>` : ""}
        <button class="btn ${saved ? "" : "primary"}" data-action="start">${saved ? "🔄 Start fresh" : "▶ Start " + (prefs.mode === "test" ? "Test" : "Practice")}</button>
      </div>
    </div>
    <div class="panel"><div class="panel-h">🏷️ Inside this set</div><div class="mini-chips">${mc.map(([m, c]) => `<span>${esc(m)} <b>${c}</b></span>`).join("")}</div></div>
    <div class="panel">
      <div class="panel-h">📄 Download PDF</div>
      <p>Exports all ${plural(n, "question")} of this set in A4 format with the Bankers Alliance watermark.</p>
      <div class="cta-row">
        <button class="btn" data-action="pdf" data-kind="paper">📝 Question paper</button>
        <button class="btn" data-action="pdf" data-kind="full">✅ With answers &amp; solutions</button>
      </div>
    </div>` : `<div class="empty"><div class="big">🗂️</div>Nothing here yet.</div>`}`;
}

/* =====================================================================
   QUESTION CARD  (used by the quiz and by the review screen)
   ===================================================================== */
function questionCardHTML(q, o){
  const t = topicOf(q), label = qLabelOnly(q), bm = bookmarks.has(q.id), reveal = !!o.reveal;
  const opts = Object.keys(q.options).map(k => {
    let cls = "opt", mark = "";
    const picked = o.selected === k;
    if(reveal){
      if(k === q.answer){ cls += " correct"; mark = o.review ? "✓ Correct" : "✓"; }
      else if(picked){ cls += " wrong"; mark = o.review ? "✗ Your answer" : "✗"; }
      else cls += " dim";
    } else if(picked) cls += " selected";
    const attrs = o.locked ? "disabled" : `data-action="opt" data-key="${k}"`;
    return `<button class="${cls}" ${attrs}><span class="opt-key">${k}</span><span class="opt-text">${sanitize(q.options[k])}</span><span class="opt-mark">${mark}</span></button>`;
  }).join("");

  let fb = "", sol = "";
  if(reveal){
    if(!o.selected) fb = `<div class="fb skip" role="status">⏭️ Not attempted — correct answer: <b>${q.answer}</b></div>`;
    else if(o.selected === q.answer) fb = `<div class="fb ok" role="status">🎉 Correct! Well done.</div>`;
    else fb = `<div class="fb bad" role="status">❌ Incorrect. The correct answer is <b>${q.answer}. ${sanitize(q.options[q.answer])}</b></div>`;
    sol = `<div class="sol"><div class="sol-h">💡 Explanation</div><div class="sol-b">${q.solution ? sanitize(q.solution) : "<p>No explanation added for this question.</p>"}</div></div>`;
  }
  let badge = "";
  if(o.status) badge = `<span class="qbadge ${o.status}">${o.status === "ok" ? "✓ Correct" : o.status === "bad" ? "✗ Wrong" : "— Skipped"}</span>`;

  return `
  <article class="qcard" style="--n-color:var(--${t.code})">
    <div class="qhead">
      <div class="qhead-top"><span class="qnum">Q${o.n}<small> / ${o.total}</small></span>${badge}
        <button class="star ${bm ? "on" : ""}" data-action="bookmark" data-id="${esc(q.id)}" aria-label="Save this question" title="Save this question">${bm ? "★" : "☆"}</button></div>
      <div class="qpath">${t.emoji} ${esc(t.name)} <span>›</span> ${esc(q.sub)} <span>›</span> ${esc(q.minor)}</div>
    </div>
    <div class="qbody">
      ${label ? `<div class="qlabel">${esc(label)}</div>` : ""}
      ${q.passage ? `<div class="passage"><div class="passage-h">📖 READ CAREFULLY</div>${sanitize(q.passage)}</div>` : ""}
      ${!label && q.question ? `<div class="qtext">${sanitize(q.question)}</div>` : ""}
      <div class="opts" role="group" aria-label="Answer options">${opts}</div>
      ${o.canClear ? `<div class="clear-row"><button class="btn-sm" data-action="clear">Clear answer</button></div>` : ""}
      <div aria-live="polite">${fb}${sol}</div>
    </div>
  </article>`;
}

/* =====================================================================
   QUIZ
   ===================================================================== */
function saveSession(){
  if(!session || session.finished) return;
  session.updatedAt = Date.now();
  sessions[session.key] = session;
  const keys = Object.keys(sessions);
  if(keys.length > 8){ keys.sort((a, b) => (sessions[a].updatedAt||0) - (sessions[b].updatedAt||0)); delete sessions[keys[0]]; }
  LS.set("sessions", sessions);
}
function dropSession(key){ delete sessions[key]; LS.set("sessions", sessions); }
function newSession(p){
  return {key:p.key, label:p.label, pdfLabel:p.pdfLabel, scope:p.scope || {}, mode:p.mode, neg:p.neg, ids:p.ids,
          answers:{}, times:{}, idx:0, elapsed:0, updatedAt:Date.now(), finished:false};
}
function startFromScope(sc, resume){
  const key = scopeKey(sc);
  if(resume && sessions[key]){
    const s = sessions[key]; s.ids = s.ids.filter(id => QBYID.has(id));
    if(s.ids.length){ s.finished = false; session = s; pushView("quiz"); return; }
    dropSession(key);
  }
  let ids = filterQ(sc).map(q => q.id); if(!ids.length) return;
  const take = effCount(ids.length);
  if(prefs.shuffle || take) shuffle(ids);
  if(take) ids = ids.slice(0, take);
  session = newSession({key, label: scopeTitle(sc), pdfLabel: pdfSection(sc), scope: sc, mode: prefs.mode, neg: prefs.neg, ids});
  saveSession(); pushView("quiz");
}
function resumeByKey(key){
  const s = sessions[key]; if(!s) return;
  s.ids = s.ids.filter(id => QBYID.has(id));
  if(!s.ids.length){ dropSession(key); render(); return; }
  s.finished = false; session = s; pushView("quiz");
}
const attemptedCount = s => s.ids.filter(id => s.answers[id]).length;

function viewQuiz(){
  const s = session, total = s.ids.length;
  s.idx = Math.min(Math.max(s.idx, 0), total - 1);
  const q = QBYID.get(s.ids[s.idx]), sel = s.answers[q.id];
  const practice = s.mode === "practice", reveal = practice && !!sel;
  const attempted = attemptedCount(s), allDone = attempted === total, last = s.idx === total - 1;

  const pal = s.ids.map((id, i) => {
    const a = s.answers[id], qq = QBYID.get(id); let st = "";
    if(a) st = practice ? (a === qq.answer ? "ok" : "bad") : "ans";
    return `<button class="pal-btn ${st} ${i === s.idx ? "cur" : ""}" data-action="goto" data-i="${i}" aria-label="Question ${i+1}">${i+1}${bookmarks.has(id) ? "<i>★</i>" : ""}</button>`;
  }).join("");

  app.innerHTML = `
    <div class="quiz-top">
      <div class="quiz-title">${esc(s.label)}<small>${plural(total, "question")}${s.neg ? " · −¼ negative marking" : ""}</small></div>
      <span class="mode-pill">${practice ? "📘 Practice" : "📝 Test"}</span>
      <span class="timer" title="Time spent">⏱ <span id="timer">${fmtTime(s.elapsed)}</span></span>
      <button class="btn-sm" data-action="finish">🏁 Finish</button>
    </div>
    <div class="progress" aria-label="Progress"><i style="width:${attempted / total * 100}%"></i></div>
    ${allDone ? `<div class="done-banner"><span>🎉 All ${total} questions attempted!</span><button class="btn-sm" data-action="finish">View Result 🏁</button></div>` : ""}
    <div class="quiz-wrap">
      <div>${questionCardHTML(q, {n: s.idx + 1, total, selected: sel, reveal, locked: reveal, canClear: !practice && !!sel})}</div>
      <aside class="palette ${ui.paletteOpen ? "open" : ""}" id="palette" aria-label="Question palette">
        <div class="pal-head">Questions <span>${attempted}/${total} answered</span></div>
        <div class="pal-grid">${pal}</div>
        <div class="pal-legend">
          ${practice ? `<span><b style="background:var(--ok)"></b>Correct</span><span><b style="background:var(--bad)"></b>Wrong</span>` : `<span><b style="background:var(--info)"></b>Answered</span>`}
          <span><b style="background:#fff;border:1.5px solid var(--line)"></b>Not yet</span><span>★ Saved</span>
        </div>
        <button class="btn primary" data-action="finish">🏁 Finish &amp; see result</button>
      </aside>
    </div>
    <div class="sheet-backdrop ${ui.paletteOpen ? "open" : ""}" data-action="palette"></div>
    <div class="qnav">
      <button class="btn" data-action="prev" ${s.idx === 0 ? "disabled" : ""}>← Prev</button>
      <button class="btn pal-toggle" data-action="palette">▦ ${s.idx + 1}/${total}</button>
      ${last ? `<button class="btn primary" data-action="finish">🏁 ${allDone ? "View Result" : "Finish"}</button>`
             : `<button class="btn ${(!practice || sel) ? "primary" : ""}" data-action="next">Next →</button>`}
    </div>`;
}

function chooseOption(key){
  const s = session; if(!s) return;
  const q = QBYID.get(s.ids[s.idx]); if(!q || !q.options[key]) return;
  if(s.mode === "practice"){
    if(s.answers[q.id]) return;
    s.answers[q.id] = key;
    if(key === q.answer) mistakes.delete(q.id); else mistakes.add(q.id);
    LS.set("mistakes", [...mistakes]);
  } else s.answers[q.id] = key;
  saveSession(); viewQuiz();
  if(s.mode === "practice"){ const fb = $(".fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({behavior:"smooth", block:"center"}); }
}
function moveTo(i){
  const s = session; if(!s) return;
  s.idx = Math.min(Math.max(i, 0), s.ids.length - 1); ui.paletteOpen = false; saveSession(); viewQuiz(); window.scrollTo(0, 0);
}
function toggleBookmark(id){
  if(!id) return;
  if(bookmarks.has(id)){ bookmarks.delete(id); toast("Removed from saved"); } else { bookmarks.add(id); toast("⭐ Saved for later"); }
  LS.set("bookmarks", [...bookmarks]);
  document.querySelectorAll('[data-action="bookmark"]').forEach(b => {
    if(b.dataset.id === id){ const on = bookmarks.has(id); b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; }
  });
}

/* stopwatch : counts only while the quiz screen is visible */
setInterval(() => {
  if(cur().v !== "quiz" || !session || document.hidden) return;
  session.elapsed++;
  const id = session.ids[session.idx]; session.times[id] = (session.times[id] || 0) + 1;
  const el = $("#timer"); if(el) el.textContent = fmtTime(session.elapsed);
  if(session.elapsed % 10 === 0) saveSession();
}, 1000);

/* =====================================================================
   RESULT + REVIEW
   ===================================================================== */
function computeResult(s){
  let correct = 0, wrong = 0, skipped = 0; const wrongIds = [], groups = new Map();
  s.ids.forEach(id => {
    const q = QBYID.get(id); if(!q) return;
    const a = s.answers[id]; let st;
    if(!a){ skipped++; st = "skip"; } else if(a === q.answer){ correct++; st = "ok"; } else { wrong++; st = "bad"; wrongIds.push(id); }
    const g = groups.get(q.minor) || {name:q.minor, ok:0, bad:0, skip:0}; g[st]++; groups.set(q.minor, g);
  });
  const total = s.ids.length, net = correct - (s.neg ? wrong * NEG_MARK : 0), attempted = correct + wrong;
  return {correct, wrong, skipped, total, net, attempted, wrongIds,
    pct: total ? Math.max(0, net) / total * 100 : 0, acc: attempted ? correct / attempted * 100 : 0,
    groups: [...groups.values()].sort((a, b) => (b.ok + b.bad + b.skip) - (a.ok + a.bad + a.skip))};
}
function finishSession(){
  const s = session; if(!s) return;
  const un = s.ids.length - attemptedCount(s);
  if(un > 0 && !window.confirm(plural(un, "question") + " not attempted yet. Finish and see your result anyway?")) return;
  s.finished = true;
  if(s.mode === "test"){
    s.ids.forEach(id => { const a = s.answers[id], q = QBYID.get(id); if(!a || !q) return; if(a === q.answer) mistakes.delete(id); else mistakes.add(id); });
    LS.set("mistakes", [...mistakes]);
  }
  const r = computeResult(s);
  log.unshift({ts: Date.now(), key: s.key, label: s.label, mode: s.mode, total: r.total, correct: r.correct, wrong: r.wrong,
               skipped: r.skipped, pct: r.pct, secs: s.elapsed});
  log = log.slice(0, 40); LS.set("log", log);
  dropSession(s.key);
  replaceTop("result");
}

        <text x="60" y="68" text-anchor="middle" font-size="28">${Math.round(r.pct)}%</text>
      </svg>

        <p>${s.neg ? `${r.correct} correct − ${r.wrong} × ${NEG_MARK} negative marking` : `${r.correct} correct out of ${plural(r.total, "question")}`}</p>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat ok"><b>${r.correct}</b><span>✅ Correct</span></div>

/* =====================================================================
   PDF  (A4 · tilted watermark · header · footer · page numbers)
   ===================================================================== */
function buildPdf(list, sectionLabel, kind){
  if(!list.length){ toast("Nothing to export yet."); return; }
  if(!(window.jspdf && window.jspdf.jsPDF)){ toast("PDF library didn’t load — check your internet and try again."); return; }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const mx = 16, top = 28, bottom = H - 18, cw = W - 2 * mx;
  let y = top;

  function watermark(){
    // jsPDF's align:"center" ignores rotation, so centre the tilted text by hand
    doc.setFont("helvetica", "bold"); doc.setFontSize(52); doc.setTextColor(232, 232, 226);
    const tw = doc.getTextWidth(PDF_WATERMARK), rad = 45 * Math.PI / 180;
    const lift = 52 * 0.3528 * 0.35;                       // nudge so the letters (not the baseline) are centred
    doc.text(PDF_WATERMARK, W / 2 - (tw / 2) * Math.cos(rad) + lift * Math.sin(rad),
                            H / 2 + (tw / 2) * Math.sin(rad) + lift * Math.cos(rad), {angle: 45});
  }
  function header(){
    const txt = pdfSafe(PDF_HEADER_PREFIX + " " + sectionLabel);
    let size = 13; doc.setFont("helvetica", "bold"); doc.setFontSize(size);
    while(size > 8 && doc.getTextWidth(txt) > cw){ size -= 0.5; doc.setFontSize(size); }
    doc.setTextColor(18, 54, 38); doc.text(txt, mx, 15);
    doc.setDrawColor(226, 171, 68); doc.setLineWidth(0.6); doc.line(mx, 18, W - mx, 18);
  }
  function startPage(){ watermark(); header(); y = top; }
  function newPage(){ doc.addPage(); startPage(); }
  startPage();

  const wrap = (text, w, size, bold) => {
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size);
    const out = []; pdfSafe(text).split("\n").forEach(p => out.push(...doc.splitTextToSize(p.trim() === "" ? " " : p, w))); return out;
  };
  const style = c => { doc.setFont("helvetica", c.bold ? "bold" : "normal"); doc.setFontSize(c.size); doc.setTextColor(c.color[0], c.color[1], c.color[2]); };

  list.forEach((q, i) => {
    const cmds = [];
    const addText = (text, x, w, size, bold, color, lh, bar) => {
      const lines = wrap(text, w, size, bold); if(lines.length && pdfSafe(text).trim()) cmds.push({t:"text", lines, x, size, bold, color, lh, bar});
    };
    const gap = h => cmds.push({t:"gap", h});
    const lab = qLabelOnly(q), qt = htmlToText(q.question);
    if(q.passage){
      addText("Q" + (i + 1) + "." + (lab ? "  " + lab : ""), mx, cw, 10.5, true, [110, 110, 100], 5.4);
      addText(htmlToText(q.passage), mx + 5, cw - 5, 10, false, [60, 60, 52], 5, true);
      gap(2); if(!lab && qt) addText(qt, mx, cw, 11, true, [18, 36, 28], 5.6);
    } else addText("Q" + (i + 1) + ". " + qt, mx, cw, 11, true, [18, 36, 28], 5.6);
    gap(1.5);
    Object.keys(q.options).forEach(k => addText(k + ".  " + htmlToText(q.options[k]), mx + 3, cw - 3, 10.5, false, [30, 36, 31], 5.2));
    if(kind === "full"){
      gap(1.5); addText("Answer: " + q.answer, mx, cw, 10.5, true, [22, 120, 70], 5.4);
      if(q.solution) addText("Solution: " + htmlToText(q.solution), mx, cw, 9.8, false, [70, 70, 62], 4.9);
    }
    gap(2); cmds.push({t:"rule"}); gap(4);

    // keep a question together on one page when it fits on a page
    const total = cmds.reduce((s, c) => s + (c.t === "text" ? c.lines.length * c.lh : c.t === "gap" ? c.h : 0), 0);
    if(y + total > bottom && total <= bottom - top) newPage();

    cmds.forEach(c => {
      if(c.t === "gap"){ y += c.h; return; }
      if(c.t === "rule"){ doc.setDrawColor(222, 222, 212); doc.setLineWidth(0.3); doc.line(mx, y, W - mx, y); return; }
      style(c);
      c.lines.forEach(line => {
        if(y + c.lh > bottom){ newPage(); style(c); }
        doc.text(line, c.x, y);
        if(c.bar){ doc.setDrawColor(226, 171, 68); doc.setLineWidth(0.9); doc.line(mx + 1.5, y - c.lh * 0.78, mx + 1.5, y + c.lh * 0.22); }
        y += c.lh;
      });
    });
  });

  const pages = doc.internal.getNumberOfPages();
  for(let p = 1; p <= pages; p++){
    doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(110, 110, 100);
    doc.text(PDF_FOOTER_TEXT, W / 2, H - 10, {align: "center"});
    doc.text(p + " / " + pages, W - mx, H - 10, {align: "right"});
  }
  const slug = String(sectionLabel).replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "").toLowerCase() || "mcqs";
  doc.save("ga-pulse-" + slug + (kind === "full" ? "-with-answers" : "-paper") + ".pdf");
  toast("📄 PDF ready");
}

/* =====================================================================
   EVENTS  (one delegated click handler for the whole app)
   ===================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if(!el || el.disabled) return;
  const a = el.dataset.action, sc = cur().scope || {};
  switch(a){
    case "home": goHome(); break;
    case "month": pushView("topics", {month: el.dataset.m === "all" ? null : Number(el.dataset.m)}); break;
    case "special": pushView("overview", {special: el.dataset.kind, month: null}); break;
    case "topic": {
      const code = el.dataset.code, t = topicByCode(code), next = {...sc, main: code};
      if(t.subs.length === 1) pushView("minors", {...next, sub: t.subs[0].name}); else pushView("subs", next); break;
    }
    case "sub": pushView("minors", {...sc, sub: decodeURIComponent(el.dataset.sub)}); break;
    case "minor": pushView("overview", {...sc, minor: decodeURIComponent(el.dataset.minor)}); break;
    case "practice": pushView("overview", {...sc}); break;
    case "pref": {
      const k = el.dataset.k, v = el.dataset.v;
      if(k === "mode") prefs.mode = v; else if(k === "count") prefs.count = Number(v);
      else if(k === "shuffle") prefs.shuffle = v === "1"; else if(k === "neg") prefs.neg = v === "1";
      LS.set("prefs", prefs); render(true); break;
    }
    case "start": startFromScope(sc, false); break;
    case "resume": startFromScope(sc, true); break;
    case "resume-key": resumeByKey(el.dataset.key); break;
    case "opt": chooseOption(el.dataset.key); break;
    case "clear": if(session){ delete session.answers[session.ids[session.idx]]; saveSession(); viewQuiz(); } break;
    case "next": moveTo(session.idx + 1); break;
    case "prev": moveTo(session.idx - 1); break;
    case "goto": moveTo(Number(el.dataset.i)); break;
    case "palette": ui.paletteOpen = !ui.paletteOpen; viewQuiz(); break;
    case "finish": finishSession(); break;
    case "bookmark": toggleBookmark(el.dataset.id); break;
    case "review": ui.reviewFilter = "all"; pushView("review"); break;
    case "rfilter": ui.reviewFilter = el.dataset.f; viewReview(); break;
    case "retry-wrong": {
      const ids = computeResult(session).wrongIds.slice(); if(!ids.length) break;
      session = newSession({key: session.key + "|retry", label: "Retry: " + session.label, pdfLabel: session.pdfLabel + " - Mistakes",
                            scope: session.scope, mode: "practice", neg: false, ids});
      saveSession(); replaceTop("quiz"); break;
    }
    case "restart": {
      const old = session;
      session = newSession({key: old.key, label: old.label, pdfLabel: old.pdfLabel, scope: old.scope, mode: old.mode, neg: old.neg, ids: shuffle(old.ids.slice())});
      saveSession(); replaceTop("quiz"); break;
    }
    case "pdf": buildPdf(filterQ(sc), pdfSection(sc), el.dataset.kind); break;
    case "pdf-session": buildPdf(session.ids.map(id => QBYID.get(id)).filter(Boolean), session.pdfLabel || session.label, "full"); break;
    case "share": {
      const r = computeResult(session);
      const text = `I scored ${r.correct}/${r.total} (${Math.round(r.pct)}%) in “${session.label}” on ${BRAND}. Try it yourself!`;
      if(navigator.share) navigator.share({title: BRAND, text, url: location.href}).catch(() => {});
      else if(navigator.clipboard) navigator.clipboard.writeText(text + " " + location.href).then(() => toast("Score copied to clipboard"), () => toast(text));
      else toast(text);
      break;
    }
    case "clear-log": log = []; LS.set("log", log); render(true); break;
  }
});
document.addEventListener("keydown", e => {
  if(cur().v !== "quiz" || !session || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = (e.target.tagName || "").toLowerCase(); if(t === "input" || t === "textarea" || t === "select") return;
  const k = e.key;
  if(/^[a-fA-F]$/.test(k)) chooseOption(k.toUpperCase());
  else if(/^[1-6]$/.test(k)) chooseOption("ABCDEF"[Number(k) - 1]);
  else if(k === "ArrowRight" || k === "n") moveTo(session.idx + 1);
  else if(k === "ArrowLeft" || k === "p") moveTo(session.idx - 1);
  else if(k === "s") toggleBookmark(session.ids[session.idx]);
});

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  try{
    const [tr, qr] = await Promise.all([fetch("data/topics.json", {cache:"no-store"}), fetch("data/questions.json", {cache:"no-store"})]);
    if(!tr.ok) throw new Error("data/topics.json → HTTP " + tr.status);
    if(!qr.ok) throw new Error("data/questions.json → HTTP " + qr.status);
    TOPICS = await tr.json(); prepareData(await qr.json());
    render();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="empty"><div class="big">⚠️</div><b>Could not load the question bank.</b><br>${esc(err.message)}<br><br>
      Make sure <code>data/topics.json</code> and <code>data/questions.json</code> are next to this file and that the page is opened over
      <code>http(s)://</code> (e.g. your hosted site), not by double-clicking the HTML file.</div>`;
  }
}
window.__ga = { get nav(){ return nav; }, get session(){ return session; } };   // handy for debugging
boot();
})();
</script>
