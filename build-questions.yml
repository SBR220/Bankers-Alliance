name: Build questions.json from MCQ text files

# Runs automatically when you add/edit a file in data/raw/ (or the tag map / topics),
# and can be started by hand from the Actions tab ("Run workflow").
on:
  push:
    paths:
      - "data/raw/**"
      - "data/tag_map.json"
      - "data/topics.json"
      - "scripts/mcq_to_json.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Convert MCQ text files to data/questions.json
        run: python3 scripts/mcq_to_json.py
      - name: Commit updated questions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-build questions.json from MCQ text files"
          git push
