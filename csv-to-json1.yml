name: Convert news CSV to JSON

# Runs automatically whenever a CSV in /data changes,
# and can also be triggered manually from the Actions tab (workflow_dispatch).
on:
  push:
    paths:
      - "data/*.csv"
  workflow_dispatch:
    inputs:
      csv_file:
        description: "Path to the CSV file to convert"
        required: true
        default: "data/news_template.csv"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert CSV to news.json
        run: |
          CSV_PATH="${{ github.event.inputs.csv_file || 'data/news_template.csv' }}"
          echo "Converting $CSV_PATH -> data/news.json"
          python3 scripts/csv_to_json.py "$CSV_PATH" data/news.json

      - name: Commit updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update news.json from CSV"
          git push
